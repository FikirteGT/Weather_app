name: weather_app # This is your app's name - MUST be the first line

description: A Flutter weather app that displays current weather conditions # Brief description of your app

publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1 # App version: 1.0.0 (semantic version), +1 (build number)

environment: 
  sdk: '>=3.0.0 <4.0.0' # SDK version compatibility

dependencies: # All packages your app needs to RUN
  flutter:
    sdk: flutter  # Flutter framework - REQUIRED
  http: ^1.1.0   # HTTP client for API calls - for fetching weather data
  intl: ^0.18.0  # Internationalization - for formatting dates/times nicely
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.0

dev_dependencies: # Packages needed only during DEVELOPMENT
  flutter_test:
    sdk: flutter  # Testing framework - for writing tests
  flutter_lints: ^2.0.0 # Linting rules - helps you write better code

flutter:
  uses-material-design: true
  assets:
    - assets/image/cloudy.png
    - assets/image/heavy-rain.png
    - assets/image/night.png